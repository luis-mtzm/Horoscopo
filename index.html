<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tu Horóscopo Diario</title>
    <style>
        body {
            font-family: 'Georgia', serif;
            background: linear-gradient(135deg, #fff5f5 0%, #fff9f3 100%);
            color: #4a3b32;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            background-color: rgba(255, 255, 255, 0.85);
            padding: 40px 30px;
            border-radius: 24px;
            box-shadow: 0 8px 32px rgba(224, 196, 180, 0.2);
            max-width: 420px;
            width: 90%;
            text-align: center;
            border: 1px solid rgba(245, 222, 209, 0.5);
            backdrop-filter: blur(8px);
            margin: 20px 0;
        }

        h1 {
            font-size: 1.8rem;
            color: #8c6239;
            margin-bottom: 10px;
            font-weight: normal;
            letter-spacing: 1px;
        }

        p.subtitle {
            font-size: 0.95rem;
            color: #7d685c;
            line-height: 1.5;
            margin-bottom: 30px;
        }

        .form-group {
            text-align: left;
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-size: 0.85rem;
            color: #7d685c;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #e6d5cb;
            border-radius: 12px;
            font-family: inherit;
            font-size: 1rem;
            color: #4a3b32;
            background-color: #fffdfc;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #e2b49a 0%, #d49a83 100%);
            color: white;
            border: none;
            border-radius: 12px;
            font-family: inherit;
            font-size: 1.1rem;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(212, 154, 131, 0.3);
            margin-top: 10px;
        }

        button:disabled {
            background: #e6d5cb;
            cursor: not-allowed;
        }

        #horoscopo-resultado {
            margin-top: 30px;
            padding-top: 20px;
            border-top: 1px dashed #e6d5cb;
            display: none;
        }

        .triada-astrologica {
            background-color: rgba(245, 222, 209, 0.3);
            padding: 15px;
            border-radius: 14px;
            margin-bottom: 20px;
            font-size: 0.95rem;
            color: #8c6239;
            display: flex;
            justify-content: space-around;
        }

        .mensaje-ia {
            font-size: 1.05rem;
            line-height: 1.6;
            color: #5a4538;
            text-align: justify;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Tu Guía Diaria</h1>
        <p class="subtitle">Descubre el mensaje que los astros tienen para tu caminar hoy. Un espacio de luz y consciencia.</p>
        
        <form id="horoscopo-form">
            <div class="form-group">
                <label for="fecha">Fecha de Nacimiento</label>
                <input type="date" id="fecha" required>
            </div>
            
            <div class="form-group">
                <label for="hora">Hora Exacta</label>
                <input type="time" id="hora" required>
            </div>

            <div class="form-group">
                <label for="lugar">Ciudad y País de Nacimiento</label>
                <input type="text" id="lugar" placeholder="Ej. Monterrey, México" required>
            </div>
            
            <button type="submit" id="btn-enviar">Calcular Mi Mapa</button>
        </form>

        <div id="horoscopo-resultado">
            <!-- Bloque del Compendio Local: Muestra los signos calculados al instante -->
            <div class="triada-astrologica">
                <div>☀️ Sol: <strong id="signo-solar">-</strong></div>
                <div>🌅 Ascendente: <strong id="signo-ascendente">-</strong></div>
            </div>
            <div class="mensaje-ia" id="texto-horoscopo"></div>
        </div>
    </div>

    <script>
        // Listado de los signos del zodiaco
        const signos = ["Capricornio", "Acuario", "Piscis", "Aries", "Tauro", "Géminis", "Cáncer", "Leo", "Virgo", "Libra", "Escorpio", "Sagitario"];

        // 1. COMPENDIO MATEMÁTICO LOCAL
        function obtenerSignoSolar(mes, dia) {
            const fechasCorte = [20, 19, 20, 20, 21, 21, 22, 23, 23, 23, 22, 22];
            return (dia < fechasCorte[mes - 1]) ? signos[mes - 1] : signos[mes % 12];
        }

        function calcularAscendenteEstimado(mes, dia, horaStr) {
            // Estimación clásica basada en la posición del sol y la hora de nacimiento
            const [horas, minutos] = horaStr.split(':').map(Number);
            const signoSolar = obtenerSignoSolar(mes, dia);
            const indiceSolar = signos.indexOf(signoSolar);
            
            // Cada 2 horas desde el amanecer (aprox 6:00 AM) el ascendente cambia de signo
            let horaCalculo = horas + (minutos / 60);
            let desfaseHoras = (horaCalculo >= 6) ? (horaCalculo - 6) : (horaCalculo + 18);
            let signosMovidos = Math.floor(desfaseHoras / 2);
            
            let indiceAscendente = (indiceSolar + signosMovidos) % 12;
            return signos[indiceAscendente];
        }

        // 2. CONTROL DEL FORMULARIO
        document.getElementById('horoscopo-form').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const fechaVal = document.getElementById('fecha').value;
            const horaVal = document.getElementById('hora').value;
            const lugarVal = document.getElementById('lugar').value;
            const boton = document.getElementById('btn-enviar');
            const contenedorResultado = document.getElementById('horoscopo-resultado');
            
            // Separamos año, mes y día de la fecha introducida
            const [ano, mes, dia] = fechaVal.split('-').map(Number);
            
            // Ejecutamos el compendio local al instante
            const solCalculado = obtenerSignoSolar(mes, dia);
            const ascendenteCalculado = calcularAscendenteEstimado(mes, dia, horaVal);
            
            // Pintamos los resultados en la interfaz de inmediato
            document.getElementById('signo-solar').innerText = solCalculado;
            document.getElementById('signo-ascendente').innerText = ascendenteCalculado;
            
            boton.disabled = true;
            boton.innerText = "Sintonizando el clima astral...";
            
            // Simulación del paso 2 (Aquí es donde la IA responderá basándose en los datos calculados)
            setTimeout(() => {
                let textoHoroscopo = document.getElementById('texto-horoscopo');
                textoHoroscopo.innerHTML = `
                    Querido buscador nacido en <strong>${lugarVal}</strong>,<br><br>
                    Al integrar tu esencia con el <strong>Sol en ${solCalculado}</strong> y tu caminar guiado por el <strong>Ascendente en ${ascendenteCalculado}</strong>, la atmósfera de hoy te propone un reencuentro con tu centro espiritual.<br><br>
                    Utiliza la estructura de tu signo solar para organizar tus intenciones en este día, mientras dejas que la energía de tu ascendente suavice tus interacciones con el entorno. Un mensaje de paz te acompaña.
                `;
                
                contenedorResultado.style.display = 'block';
                boton.disabled = false;
                boton.innerText = "Calcular Mi Mapa";
            }, 1200);
        });
    </script>
</body>
</html>
