<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tu Horóscopo Diario</title>
    <style>
        body {
            font-family: 'Georgia', serif;
            background: linear-gradient(135deg, #fff5f5 0%, #fff9f3 100%);
            color: #4a3b32;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            background-color: rgba(255, 255, 255, 0.85);
            padding: 40px 30px;
            border-radius: 24px;
            box-shadow: 0 8px 32px rgba(224, 196, 180, 0.2);
            max-width: 420px;
            width: 90%;
            text-align: center;
            border: 1px solid rgba(245, 222, 209, 0.5);
            backdrop-filter: blur(8px);
            margin: 20px 0;
        }

        h1 {
            font-size: 1.8rem;
            color: #8c6239;
            margin-bottom: 10px;
            font-weight: normal;
            letter-spacing: 1px;
        }

        p.subtitle {
            font-size: 0.95rem;
            color: #7d685c;
            line-height: 1.5;
            margin-bottom: 30px;
        }

        .form-group {
            text-align: left;
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-size: 0.85rem;
            color: #7d685c;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #e6d5cb;
            border-radius: 12px;
            font-family: inherit;
            font-size: 1rem;
            color: #4a3b32;
            background-color: #fffdfc;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #e2b49a 0%, #d49a83 100%);
            color: white;
            border: none;
            border-radius: 12px;
            font-family: inherit;
            font-size: 1.1rem;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(212, 154, 131, 0.3);
            margin-top: 10px;
        }

        button:disabled {
            background: #e6d5cb;
            cursor: not-allowed;
        }

        #horoscopo-resultado {
            margin-top: 30px;
            padding-top: 20px;
            border-top: 1px dashed #e6d5cb;
            display: none;
        }

        .mensaje-ia {
            font-size: 1.05rem;
            line-height: 1.6;
            color: #5a4538;
            text-align: justify;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Tu Guía Diaria</h1>
        <p class="subtitle">Descubre el mensaje que los astros tienen para tu caminar hoy. Un espacio de luz y consciencia.</p>
        
        <form id="horoscopo-form">
            <div class="form-group">
                <label for="fecha">Fecha de Nacimiento</label>
                <input type="date" id="fecha" required>
            </div>
            
            <div class="form-group">
                <label for="hora">Hora Exacta</label>
                <input type="time" id="hora" required>
            </div>

            <!-- NUEVO CAMPO: Lugar de Nacimiento -->
            <div class="form-group">
                <label for="lugar">Ciudad y País de Nacimiento</label>
                <input type="text" id="lugar" placeholder="Ej. Monterrey, México" required>
            </div>
            
            <button type="submit" id="btn-enviar">Recibir Mensaje</button>
        </form>

        <div id="horoscopo-resultado">
            <div class="mensaje-ia" id="texto-horoscopo"></div>
        </div>
    </div>

    <script>
        document.getElementById('horoscopo-form').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const fecha = document.getElementById('fecha').value;
            const hora = document.getElementById('hora').value;
            const lugar = document.getElementById('lugar').value; // Captura el lugar
            const boton = document.getElementById('btn-enviar');
            const contenedorResultado = document.getElementById('horoscopo-resultado');
            const textoHoroscopo = document.getElementById('texto-horoscopo');
            
            boton.disabled = true;
            boton.innerText = "Consultando a los astros...";
            
            setTimeout(() => {
                // Mensaje simulado que ahora contempla los tres datos esenciales
                let mensajeSimulado = `Querido buscador,<br><br>
                Hoy las fuerzas sutiles se alinean considerando el cielo bajo el cual naciste en <strong>${lugar}</strong>. Las configuraciones celestes asociadas al momento de tu nacimiento sugieren que hoy es un día idóneo para respirar con consciencia y observar los pequeños milagros cotidianos.<br><br>
                Camina con la certeza de que tu sol interior brilla con fuerza, invitándote a confiar plenamente en tus procesos de maduración internos. Abre tus sentidos y tu corazón a los encuentros inesperados; en la calidez de lo humano reside la guía que tu alma necesita para el día de hoy.`;

                textoHoroscopo.innerHTML = mensajeSimulado;
                contenedorResultado.style.display = 'block';
                
                boton.disabled = false;
                boton.innerText = "Recibir Mensaje";
                
            }, 1500); 
        });
    </script>
</body>
</html>
