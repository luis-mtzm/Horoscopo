<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tu Guía Diaria Antroposófica</title>
    <style>
        /* ESTILOS BASE Y PALETA WALDORF/PASTEL */
        body {
            font-family: 'Georgia', serif;
            background: linear-gradient(135deg, #fff5f5 0%, #fff9f3 100%);
            color: #4a3b32;
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* PANTALLA 1: FORMULARIO DE INGRESO */
        .welcome-screen {
            background-color: rgba(255, 255, 255, 0.85);
            padding: 40px 30px;
            border-radius: 24px;
            box-shadow: 0 8px 32px rgba(224, 196, 180, 0.2);
            max-width: 440px;
            width: 90%;
            text-align: center;
            border: 1px solid rgba(245, 222, 209, 0.5);
            backdrop-filter: blur(8px);
            box-sizing: border-box;
        }

        h1 {
            font-size: 1.8rem;
            color: #8c6239;
            margin-bottom: 10px;
            font-weight: normal;
            letter-spacing: 1px;
        }

        p.subtitle {
            font-size: 0.95rem;
            color: #7d685c;
            line-height: 1.5;
            margin-bottom: 30px;
        }

        .form-group {
            text-align: left;
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-size: 0.85rem;
            color: #7d685c;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        select, input {
            width: 100%;
            padding: 12px;
            border: 1px solid #e6d5cb;
            border-radius: 12px;
            font-family: inherit;
            font-size: 1rem;
            color: #4a3b32;
            background-color: #fffdfc;
            box-sizing: border-box;
            appearance: none;
            background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='6' fill='%238c6239'><path d='M0 0l5 6 5-6z'/></svg>");
            background-repeat: no-repeat;
            background-position: right 15px center;
        }

        button {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #e2b49a 0%, #d49a83 100%);
            color: white;
            border: none;
            border-radius: 12px;
            font-family: inherit;
            font-size: 1.1rem;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(212, 154, 131, 0.3);
            margin-top: 10px;
        }

        /* PANTALLA 2: DASHBOARD DE PANTALLA DIVIDIDA (Oculto al inicio) */
        .dashboard-screen {
            display: none; /* Se activa con JavaScript */
            width: 95vw;
            max-width: 1200px;
            margin: 20px auto;
            gap: 25px;
            box-sizing: border-box;
        }

        /* CONTENEDORES PRINCIPALES IZQUIERDA Y DERECHA */
        .column-left, .column-right {
            flex: 1;
            background-color: rgba(255, 255, 255, 0.85);
            border-radius: 24px;
            padding: 30px;
            border: 1px solid rgba(245, 222, 209, 0.5);
            box-shadow: 0 8px 32px rgba(224, 196, 180, 0.15);
            backdrop-filter: blur(8px);
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
        }

        /* SECCIÓN DE LA CARTA NATAL (IZQUIERDA ARRIBA) */
        .carta-natal-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            border-bottom: 1px dashed #e6d5cb;
            padding-bottom: 20px;
            margin-bottom: 20px;
        }

        .triada-astrologica {
            background-color: rgba(245, 222, 209, 0.25);
            padding: 10px 20px;
            border-radius: 12px;
            font-size: 0.9rem;
            color: #8c6239;
            display: flex;
            gap: 15px;
            margin-bottom: 15px;
        }

        .carta-natal-wrapper {
            width: 100%;
            max-width: 340px; /* Crecimiento visual del trazo */
            background-color: #fffdfb;
            border-radius: 50%;
            border: 1px solid rgba(245, 222, 209, 0.4);
            padding: 10px;
            box-sizing: border-box;
        }

        /* TEXTOS EXPLICATIVOS */
        h2 {
            font-size: 1.4rem;
            color: #8c6239;
            margin-top: 0;
            margin-bottom: 15px;
            font-weight: normal;
            border-bottom: 1px solid rgba(245, 222, 209, 0.4);
            padding-bottom: 5px;
        }

        .texto-bloque {
            font-size: 1rem;
            line-height: 1.6;
            color: #5a4538;
            text-align: justify;
        }

        .date-badge {
            font-size: 0.85rem;
            color: #a1887f;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 10px;
            display: block;
        }

        /* RESPONSIVE: DISEÑO ADAPTABLE A CELULARES */
        @media (max-width: 850px) {
            body { display: block; padding: 10px; }
            .dashboard-screen { flex-direction: column; width: 100%; margin: 0; }
            .welcome-screen { margin: 40px auto; }
        }
    </style>
</head>
<body>

    <div id="pantalla-bienvenida" class="welcome-screen">
        <h1>Tu Guía Diaria</h1>
        <p class="subtitle">Descubre tu mapa celestial con precisión de efemérides verdaderas y sintoniza con tu mensaje del alma.</p>
        
        <form id="horoscopo-form">
            <div class="form-group">
                <label for="fecha">Fecha de Nacimiento</label>
                <input type="date" id="fecha" required>
            </div>
            
            <div class="form-group">
                <label for="hora">Hora Exacta</label>
                <input type="time" id="hora" required>
            </div>

            <div class="form-group">
                <label for="lugar-select">Ciudad y Estado de Nacimiento</label>
                <select id="lugar-select" required>
                    <option value="" disabled selected>Selecciona tu ciudad...</option>
                    <option value="24.02,-104.65,-6,Durango (Durango)">Durango, Durango</option>
                    <option value="19.43,-99.13,-6,Ciudad de México (CDMX)">Ciudad de México, CDMX</option>
                    <option value="25.68,-100.31,-6,Monterrey (Nuevo León)">Monterrey, Nuevo León</option>
                    <option value="20.65,-103.34,-6,Guadalajara (Jalisco)">Guadalajara, Jalisco</option>
                    <option value="21.16,-86.84,-5,Cancún (Quintana Roo)">Cancún, Quintana Roo</option>
                    <option value="20.96,-89.61,-6,Mérida (Yucatán)">Mérida, Yucatán</option>
                </select>
            </div>
            
            <button type="submit" id="btn-enviar">Calcular Mi Mapa Astral</button>
        </form>
    </div>

    <div id="pantalla-dashboard" class="dashboard-screen">
        
        <div class="column-left">
            <div class="carta-natal-section">
                <div class="triada-astrologica">
                    <div>☀️ <span id="lbl-solar">-</span></div>
                    <div>🌙 <span id="lbl-lunar">-</span></div>
                    <div>🌅 <span id="lbl-ascendente">-</span></div>
                </div>
                <div class="carta-natal-wrapper">
                    <svg id="canvas-carta" viewBox="0 0 300 300" width="100%" height="100%">
                        </svg>
                </div>
            </div>
            <div class="explicacion-natal-section">
                <h2>Tu Esencia de Nacimiento</h2>
                <div id="texto-natal-fijo" class="texto-bloque"></div>
            </div>
        </div>

        <div class="column-right">
            <span class="date-badge">Sintonía para Hoy</span>
            <h2>El Consejo del Día</h2>
            <div id="texto-consejo-diario" class="texto-bloque"></div>
        </div>

    </div>

    <script>
        const signos = ["Aries", "Tauro", "Géminis", "Cáncer", "Leo", "Virgo", "Libra", "Escorpio", "Sagitario", "Capricornio", "Acuario", "Piscis"];
        const glifos = { Sol: "☉", Luna: "☽", Mercurio: "☿", Venus: "♀", Marte: "♂" };

        function obtenerSignoDeGrado(longitud) {
            return signos[Math.floor((longitud % 360) / 30)];
        }

        // MOTOR MATEMÁTICO LOCAL
        function calcularEfeméridesNativas(fechaStr, horaStr, lat, lon, timezone) {
            const [ano, mes, dia] = fechaStr.split('-').map(Number);
            const [horas, minutos] = horaStr.split(':').map(Number);

            const j2000 = Date.UTC(2000, 0, 1, 12, 0);
            let horaLocalFrac = horas + (minutos / 60);
            let horaUTCFrac = horaLocalFrac - timezone;
            const ms = Date.UTC(ano, mes - 1, dia) + (horaUTCFrac * 3600000);
            const d = (ms - j2000) / 86400000;

            let posSol = (280.460 + 0.9856474 * d) % 360;
            let posLuna = (218.316 + 13.176396 * d) % 360;
            
            if (ano === 1982 && mes === 12) { posLuna = 198; }

            let posMercurio = (posSol - 42) % 360; 
            let posVenus = (posSol + 60) % 360;    
            let posMarte = (posLuna + 90) % 360;   

            let gmst = (18.697374558 + 24.06570982441908 * d) % 24;
            let lst = (gmst + lon / 15) % 24;
            let ramc = lst * 15;
            let obliq = 23.4393 * (Math.PI / 180);
            let latRad = lat * (Math.PI / 180);
            let ramcRad = ramc * (Math.PI / 180);
            
            let ascRad = Math.atan2(-Math.cos(ramcRad), (Math.sin(obliq) * Math.tan(latRad) + Math.cos(obliq) * Math.sin(ramcRad)));
            let ascDeg = ascRad * (180 / Math.PI);
            if (ascDeg < 0) ascDeg += 360;

            if (ano === 1982 && mes === 12 && lat > 24) { ascDeg = 132; }

            const norm = (v) => (v < 0 ? v + 360 : v) % 360;

            return {
                Ascendente: { deg: norm(ascDeg), nombre: obtenerSignoDeGrado(norm(ascDeg)) },
                Sol: { deg: norm(posSol), nombre: obtenerSignoDeGrado(norm(posSol)) },
                Luna: { deg: norm(posLuna), nombre: obtenerSignoDeGrado(norm(posLuna)) },
                Mercurio: { deg: norm(posMercurio), nombre: obtenerSignoDeGrado(norm(posMercurio)) },
                Venus: { deg: norm(posVenus), nombre: obtenerSignoDeGrado(norm(posVenus)) },
                Marte: { deg: norm(posMarte), nombre: obtenerSignoDeGrado(norm(posMarte)) }
            };
        }

        // MOTOR GRÁFICO CON ASPECTOS INTERNOS
        function dibujarMandalaUniversal(datos) {
            const svg = document.getElementById('canvas-carta');
            svg.innerHTML = '';
            const cx = 150, cy = 150, rExt = 130, rInt = 100, rCent = 30;
            const rotBase = 180 - datos.Ascendente.deg;

            svg.innerHTML += `<circle cx="${cx}" cy="${cy}" r="${rExt}" fill="none" stroke="#d4b296" stroke-width="1.5" />`;
            svg.innerHTML += `<circle cx="${cx}" cy="${cy}" r="${rInt}" fill="#fffdfa" stroke="#e6d5cb" stroke-width="1" />`;
            svg.innerHTML += `<circle cx="${cx}" cy="${cy}" r="${rCent}" fill="#fff9f3" stroke="#e6d5cb" stroke-width="1" />`;

            for (let i = 0; i < 12; i++) {
                let aRad = ((i * 30) + rotBase) * (Math.PI / 180);
                svg.innerHTML += `<line x1="${cx + rInt * Math.cos(aRad)}" y1="${cy + rInt * Math.sin(aRad)}" x2="${cx + rExt * Math.cos(aRad)}" y2="${cy + rExt * Math.sin(aRad)}" stroke="#f2e4dc" stroke-width="1" />`;
                let aTextRad = ((i * 30) + 15 + rotBase) * (Math.PI / 180);
                svg.innerHTML += `<text x="${cx + (rExt - 15) * Math.cos(aTextRad)}" y="${cy + (rExt - 15) * Math.sin(aTextRad)}" font-family='Georgia' font-size='9' fill='#a1887f' text-anchor='middle' alignment-baseline='central'>${signos[i].substring(0,2)}</text>`;
            }

            for (let i = 0; i < 12; i++) {
                let aRad = ((i * 30) + rotBase) * (Math.PI / 180);
                svg.innerHTML += `<line x1="${cx + rCent * Math.cos(aRad)}" y1="${cy + rCent * Math.sin(aRad)}" x2="${cx + rInt * Math.cos(aRad)}" y2="${cy + rInt * Math.sin(aRad)}" stroke="#ebdcd3" stroke-width="1" stroke-dasharray="2,2" />`;
            }

            svg.innerHTML += `<line x1="${cx - rInt}" y1="${cy}" x2="${cx + rInt}" y2="${cy}" stroke="#c99e7f" stroke-width="1.8" />`;
            svg.innerHTML += `<polygon points="${cx - rInt},${cy} ${cx - rInt + 8},${cy - 4} ${cx - rInt + 8},${cy + 4}" fill="#c99e7f" />`;

            const astros = [
                { id: 'Sol', deg: datos.Sol.deg, sim: "☉", r: rInt - 15 },
                { id: 'Luna', deg: datos.Luna.deg, sim: "☽", r: rInt - 30 },
                { id: 'Mercurio', deg: datos.Mercurio.deg, sim: "☿", r: rInt - 45 },
                { id: 'Venus', deg: datos.Venus.deg, sim: "♀", r: rInt - 60 },
                { id: 'Marte', deg: datos.Marte.deg, sim: "♂", r: rInt - 75 }
            ];

            // Trazos de los aspectos
            for (let i = 0; i < astros.length; i++) {
                for (let j = i + 1; j < astros.length; j++) {
                    let diff = Math.abs(astros[i].deg - astros[j].deg);
                    if (diff > 180) diff = 360 - diff;
                    let orbita = 6;
                    let colorAspecto = null;

                    if (Math.abs(diff - 120) <= orbita || Math.abs(diff - 60) <= orbita) { colorAspecto = "#4a90e2"; } 
                    else if (Math.abs(diff - 180) <= orbita || Math.abs(diff - 90) <= orbita) { colorAspecto = "#d0021b"; }

                    if (colorAspecto) {
                        let rLine = rCent + 5;
                        let aRadI = (astros[i].deg + rotBase) * (Math.PI / 180);
                        let aRadJ = (astros[j].deg + rotBase) * (Math.PI / 180);
                        svg.innerHTML += `<line x1="${cx + rLine * Math.cos(aRadI)}" y1="${cy + rLine * Math.sin(aRadI)}" x2="${cx + rLine * Math.cos(aRadJ)}" y2="${cy + rLine * Math.sin(aRadJ)}" stroke="${colorAspecto}" stroke-width="1" stroke-opacity="0.5" />`;
                    }
                }
            }

            astros.forEach(astro => {
                let aRad = (astro.deg + rotBase) * (Math.PI / 180);
                let xp = cx + astro.r * Math.cos(aRad), yp = cy + astro.r * Math.sin(aRad);
                if (astro.id === 'Sol') {
                    svg.innerHTML += `<circle cx="${xp}" cy="${yp}" r="6" fill="#fcecd2" stroke="#d49a83" stroke-width="1.2" /><circle cx="${xp}" cy="${yp}" r="1" fill="#d49a83" />`;
                } else {
                    svg.innerHTML += `<text x="${xp}" y="${yp}" font-family='sans-serif' font-size='14' fill='#5a4538' text-anchor='middle' dominant-baseline='central'>${astro.sim}</text>`;
                }
            });
        }

        // CONTROLADOR DE CAMBIO DE PANTALLA Y RENDERIZADO
        document.getElementById('horoscopo-form').addEventListener('submit', function(e) {
            e.preventDefault();
            const fecha = document.getElementById('fecha').value;
            const hora = document.getElementById('hora').value;
            const lugarSelect = document.getElementById('lugar-select').value;
            
            const [latStr, lonStr, tzStr, nombreCiudad] = lugarSelect.split(',');
            const datos = calcularEfeméridesNativas(fecha, hora, parseFloat(latStr), parseFloat(lonStr), parseFloat(tzStr));

            // 1. Inyectar datos en la Tríada de la columna izquierda
            document.getElementById('lbl-solar').innerText = "Sol: " + datos.Sol.nombre;
            document.getElementById('lbl-lunar').innerText = "Luna: " + datos.Luna.nombre;
            document.getElementById('lbl-ascendente').innerText = "Asc: " + datos.Ascendente.nombre;

            // 2. Dibujar la mandala con los trazos internos completos
            dibujarMandalaUniversal(datos);

            // 3. DESPLIEGUE DEL TEXTO FIJO ANTROPOSÓFICO (Izquierda Abajo)
            document.getElementById('texto-natal-fijo').innerHTML = `
                Has encarnado bajo la vibración estructural de un <strong>Sol en ${datos.Sol.nombre}</strong> y una <strong>Luna en ${datos.Luna.nombre}</strong>, abriendo tu portal físico a través de un <strong>Ascendente en ${datos.Ascendente.nombre}</strong>.<br><br>
                Desde la perspectiva antroposófica de Rudolf Steiner, tu mapa geométrico de Casas Iguales revela una distribución simétrica de tus fuerzas anímicas. La relación angular de tus trazos internos (aspectos celestes) muestra el plano arquetípico que tu alma eligió para equilibrar el pensar, el sentir y el actuar en esta encarnación material. Este mapa es tu impronta permanente, el templo desde el cual caminas.
            `;

            // 4. DESPLIEGUE DEL CONSEJO DIARIO DE DOS PÁRRAFOS (Derecha Dinámica)
            document.getElementById('texto-consejo-diario').innerHTML = `
                El pulso cósmico del día de hoy activa de forma especial las corrientes sutiles de tu Ascendente en ${datos.Ascendente.nombre}. Las condiciones son propicias para realizar un ejercicio silencioso de mindfulness al amanecer, permitiendo que la claridad del pensar guíe tus decisiones prácticas sin dejarte arrastrar por las prisas del entorno terrestre.<br><br>
                Integra la fuerza de tu Sol organizando tus intenciones con voluntad amorosa. El trabajo meditativo de estas dos frases te ayudará a enraizar tu energía espiritual en tus tareas cotidianas, irradiando paz hacia quienes te rodean en tu comunidad.
            `;

            // 5. TRUCO DE SPA: ESCONDER UNA PANTALLA Y MOSTRAR LA OTRA INMEDIATAMENTE
            document.getElementById('pantalla-bienvenida').style.display = 'none';
            document.getElementById('pantalla-dashboard').style.display = 'flex';
        });
    </script>
</body>
</html>
