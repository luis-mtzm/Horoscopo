<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tu Guía Diaria</title>
    <style>
        /* ESTILOS BASE Y PALETA PASTEL ELEGANTE */
        body {
            font-family: 'Georgia', serif;
            background: linear-gradient(135deg, #fff5f5 0%, #fff9f3 100%);
            color: #4a3b32;
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* PANTALLA 1: FORMULARIO DE INGRESO */
        .welcome-screen {
            background-color: rgba(255, 255, 255, 0.85);
            padding: 40px 30px;
            border-radius: 24px;
            box-shadow: 0 8px 32px rgba(224, 196, 180, 0.2);
            max-width: 460px;
            width: 90%;
            text-align: center;
            border: 1px solid rgba(245, 222, 209, 0.5);
            backdrop-filter: blur(8px);
            box-sizing: border-box;
        }

        h1 {
            font-size: 1.8rem;
            color: #8c6239;
            margin-bottom: 10px;
            font-weight: normal;
            letter-spacing: 1px;
        }

        p.subtitle {
            font-size: 0.95rem;
            color: #7d685c;
            line-height: 1.5;
            margin-bottom: 25px;
        }

        .form-group {
            text-align: left;
            margin-bottom: 18px;
        }

        label {
            display: block;
            font-size: 0.85rem;
            color: #7d685c;
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        select, input {
            width: 100%;
            padding: 12px;
            border: 1px solid #e6d5cb;
            border-radius: 12px;
            font-family: inherit;
            font-size: 1rem;
            color: #4a3b32;
            background-color: #fffdfc;
            box-sizing: border-box;
            appearance: none;
        }

        select {
            background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='6' fill='%238c6239'><path d='M0 0l5 6 5-6z'/></svg>");
            background-repeat: no-repeat;
            background-position: right 15px center;
        }

        .input-api {
            background-color: #fff9f5;
            border: 1px dashed #d49a83;
            font-family: monospace;
            font-size: 0.9rem;
        }

        button {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #e2b49a 0%, #d49a83 100%);
            color: white;
            border: none;
            border-radius: 12px;
            font-family: inherit;
            font-size: 1.1rem;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(212, 154, 131, 0.3);
            margin-top: 25px;
            display: block;
        }

        button:disabled {
            background: #e6d5cb;
            cursor: not-allowed;
            box-shadow: none;
        }

        /* PANTALLA 2: DASHBOARD DE PANTALLA DIVIDIDA */
        .dashboard-screen {
            display: none; 
            width: 95vw;
            max-width: 1200px;
            margin: 20px auto;
            gap: 25px;
            box-sizing: border-box;
        }

        .column-left, .column-right {
            flex: 1;
            background-color: rgba(255, 255, 255, 0.85);
            border-radius: 24px;
            padding: 30px;
            border: 1px solid rgba(245, 222, 209, 0.5);
            box-shadow: 0 8px 32px rgba(224, 196, 180, 0.15);
            backdrop-filter: blur(8px);
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
        }

        .carta-natal-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            border-bottom: 1px dashed #e6d5cb;
            padding-bottom: 20px;
            margin-bottom: 20px;
        }

        .triada-astrologica {
            background-color: rgba(245, 222, 209, 0.25);
            padding: 10px 20px;
            border-radius: 12px;
            font-size: 0.9rem;
            color: #8c6239;
            display: flex;
            gap: 15px;
            margin-bottom: 15px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .carta-natal-wrapper {
            width: 100%;
            max-width: 360px; 
            background-color: #fffdfb;
            border-radius: 50%;
            border: 1px solid rgba(245, 222, 209, 0.4);
            padding: 10px;
            box-sizing: border-box;
        }

        h2 {
            font-size: 1.4rem;
            color: #8c6239;
            margin-top: 0;
            margin-bottom: 15px;
            font-weight: normal;
            border-bottom: 1px solid rgba(245, 222, 209, 0.4);
            padding-bottom: 5px;
        }

        h3 {
            font-size: 1.1rem;
            color: #a1887f;
            margin-top: 20px;
            margin-bottom: 8px;
            font-weight: normal;
            letter-spacing: 0.5px;
        }

        .texto-bloque {
            font-size: 1rem;
            line-height: 1.6;
            color: #5a4538;
            text-align: justify;
        }

        .date-badge {
            font-size: 0.85rem;
            color: #d49a83;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 10px;
            display: block;
            font-weight: bold;
        }

        @media (max-width: 850px) {
            body { display: block; padding: 10px; }
            .dashboard-screen { flex-direction: column; width: 100%; margin: 0; }
            .welcome-screen { margin: 40px auto; }
        }
    </style>
</head>
<body>

    <div id="pantarma-bienvenida" class="welcome-screen">
        <h1>Tu Guía Diaria</h1>
        <p class="subtitle">Un espacio poético y preciso para sintonizar con la estructura de tu identidad astrológica real.</p>
        
        <form id="horoscopo-form">
            <div class="form-group">
                <label for="fecha">Fecha de Nacimiento</label>
                <input type="date" id="fecha" required>
            </div>
            
            <div class="form-group">
                <label for="hora">Hora Exacta</label>
                <input type="time" id="hora" required>
            </div>

            <div class="form-group">
                <label for="lugar-select">Ciudad y Estado de Nacimiento</label>
                <select id="lugar-select" required>
                    <option value="" disabled selected>Selecciona tu ciudad...</option>
                    <option value="24.02,-104.65,-6,Durango (Durango)">Durango, Durango</option>
                    <option value="19.43,-99.13,-6,Ciudad de México (CDMX)">Ciudad de México, CDMX</option>
                    <option value="25.68,-100.31,-6,Monterrey (Nuevo León)">Monterrey, Nuevo León</option>
                    <option value="20.65,-103.34,-6,Guadalajara (Jalisco)">Guadalajara, Jalisco</option>
                    <option value="21.16,-86.84,-5,Cancún (Quintana Roo)">Cancún, Quintana Roo</option>
                    <option value="20.96,-89.61,-6,Mérida (Yucatán)">Mérida, Yucatán</option>
                </select>
            </div>

            <div class="form-group">
                <label for="api-key-input">Clave de Acceso al Cosmos</label>
                <input type="password" id="api-key-input" class="input-api" placeholder="Pega aquí tu Gemini API Key..." required>
            </div>

            <div class="form-group">
                <label for="intencion-select">Alineación de Intención</label>
                <select id="intencion-select" required>
                    <option value="" disabled selected>¿Desde qué espacio consultas hoy?</option>
                    <option value="Busco claridad y estructura para un desafío actual">Busco claridad y estructura para un desafío actual</option>
                    <option value="Deseo comprender un proceso de tensión personal o laboral">Deseo comprender un proceso de tensión personal o laboral</option>
                    <option value="Busco un espacio de silencio, introspección y meditación seria">Busco un espacio de silencio, introspección y meditación seria</option>
                </select>
            </div>
            
            <button type="submit" id="btn-enviar">Calcular Mi Mapa Astral</button>
        </form>
    </div>

    <div id="pantalla-dashboard" class="dashboard-screen">
        <div class="column-left">
            <div class="carta-natal-section">
                <div class="triada-astrologica">
                    <div>☀️ <span id="lbl-solar">-</span></div>
                    <div>🌙 <span id="lbl-lunar">-</span></div>
                    <div>🌅 <span id="lbl-ascendente">-</span></div>
                </div>
                <div class="carta-natal-wrapper">
                    <svg id="canvas-carta" viewBox="0 0 300 300" width="100%" height="100%">
                        </svg>
                </div>
            </div>
            <div class="explicacion-natal-section">
                <h2>Tu Esencia de Nacimiento</h2>
                <div id="texto-natal-fijo" class="texto-bloque">Cargando lectura del alma...</div>
            </div>
        </div>

        <div class="column-right">
            <span id="fecha-actual-badge" class="date-badge">-</span>
            <h2>El Consejo del Día</h2>
            <div class="consejo-diario-contenedor">
                <h3>🍃 Para la Vida Personal</h3>
                <div id="consejo-vida" class="texto-bloque">Sintonizando...</div>
                
                <h3>💼 Para el Ámbito Laboral</h3>
                <div id="consejo-laboral" class="texto-bloque">Estructurando...</div>
            </div>
        </div>
    </div>

    <script>
        const MODEL_NAME = "gemini-1.5-flash"; 
        const signos = ["Aries", "Tauro", "Géminis", "Cáncer", "Leo", "Virgo", "Libra", "Escorpio", "Sagitario", "Capricornio", "Acuario", "Piscis"];
        const glifos = { Sol: "☉", Luna: "☽", Mercurio: "☿", Venus: "♀", Marte: "♂", Jupiter: "♃", Saturno: "♄", Urano: "♅", Neptuno: "♆", Pluto: "♇" };

        window.addEventListener('DOMContentLoaded', () => {
            const savedKey = localStorage.getItem('user_cosmos_key');
            if (savedKey) {
                document.getElementById('api-key-input').value = savedKey;
            }
        });

        function obtenerSignoDeGrado(longitud) {
            return signos[Math.floor((longitud % 360) / 30)];
        }

        function generarDatosEstructuraBase(fechaStr) {
            const [ano, mes, dia] = fechaStr.split('-').map(Number);
            let solDefault = 85; let lunaDefault = 191; let ascDefault = 185; 

            return {
                Ascendente: { deg: ascDefault, nombre: obtenerSignoDeGrado(ascDefault) },
                Sol: { deg: solDefault }, Luna: { deg: lunaDefault },
                Mercurio: { deg: solDefault - 5 }, Venus: { deg: solDefault + 12 }, Marte: { deg: lunaDefault + 30 },
                Jupiter: { deg: solDefault - 30 }, Saturno: { deg: solDefault + 60 },
                Urano: { deg: solDefault - 15 }, Neptuno: { deg: solDefault + 5 }, Pluto: { deg: solDefault - 45 },
                Cuspides: [ascDefault, (ascDefault+30)%360, (ascDefault+60)%360, (ascDefault+90)%360, (ascDefault+120)%360, (ascDefault+150)%360, (ascDefault+180)%360, (ascDefault+210)%360, (ascDefault+240)%360, (ascDefault+270)%360, (ascDefault+300)%360, (ascDefault+330)%360]
            };
        }

        function dibujarMandalaAstrodienst(datos) {
            const svg = document.getElementById('canvas-carta');
            if (!svg) return;
            svg.innerHTML = '';
            const cx = 150, cy = 150, rExt = 130, rInt = 105, rCent = 32;

            svg.innerHTML += `<circle cx="${cx}" cy="${cy}" r="${rExt}" fill="none" stroke="#d4b296" stroke-width="1.5" />`;
            svg.innerHTML += `<circle cx="${cx}" cy="${cy}" r="${rInt}" fill="#fffdfa" stroke="#e6d5cb" stroke-width="1" />`;
            svg.innerHTML += `<circle cx="${cx}" cy="${cy}" r="${rCent}" fill="#fff9f3" stroke="#e6d5cb" stroke-width="1" />`;

            function transformarAnguloFijo(gradosZodiacales) {
                return (-gradosZodiacales) * (Math.PI / 180); 
            }

            for (let i = 0; i < 12; i++) {
                let degSignoBase = i * 30;
                let aRadLinea = transformarAnguloFijo(degSignoBase);
                svg.innerHTML += `<line x1="${cx + rInt * Math.cos(aRadLinea)}" y1="${cy + rInt * Math.sin(aRadLinea)}" x2="${cx + rExt * Math.cos(aRadLinea)}" y2="${cy + rExt * Math.sin(aRadLinea)}" stroke="rgba(242,228,220,0.7)" stroke-width="1" />`;

                let aRadTexto = transformarAnguloFijo(degSignoBase + 15);
                svg.innerHTML += `<text x="${cx + (rExt - 12) * Math.cos(aRadTexto)}" y="${cy + (rExt - 12) * Math.sin(aRadTexto)}" font-family='Georgia' font-size='8.5' fill='#a1887f' text-anchor='middle' alignment-baseline='central'>${signos[i].substring(0,2)}</text>`;
            }

            for (let i = 0; i < 12; i++) {
                let degCuspide = datos.Cuspides[i];
                let aRadCuspide = transformarAnguloFijo(degCuspide);
                
                let colorLinea = (i === 0 || i === 9) ? "#b38463" : "#ebdcd3";
                let grosor = (i === 0 || i === 9) ? "1.8" : "1";
                let punteado = (i === 0 || i === 9) ? "none" : "2,2";

                svg.innerHTML += `<line x1="${cx + rCent * Math.cos(aRadCuspide)}" y1="${cy + rCent * Math.sin(aRadCuspide)}" x2="${cx + rInt * Math.cos(aRadCuspide)}" y2="${cy + rInt * Math.sin(aRadCuspide)}" stroke="${colorLinea}" stroke-width="${grosor}" stroke-dasharray="${punteado}" />`;
            }

            let anguloACReal = transformarAnguloFijo(datos.Ascendente.deg);
            let anguloDCReal = transformarAnguloFijo((datos.Ascendente.deg + 180) % 360);
            
            svg.innerHTML += `<line x1="${cx + rInt * Math.cos(anguloACReal)}" y1="${cy + rInt * Math.sin(anguloACReal)}" x2="${cx + rInt * Math.cos(anguloDCReal)}" y2="${cy + rInt * Math.sin(anguloDCReal)}" stroke="#c99e7f" stroke-width="1.5" />`;
            svg.innerHTML += `<polygon points="${cx + rInt * Math.cos(anguloACReal)},${cy + rInt * Math.sin(anguloACReal)} ${cx + (rInt-8) * Math.cos(anguloACReal + 0.05)},${cy + (rInt-8) * Math.sin(anguloACReal + 0.05)} ${cx + (rInt-8) * Math.cos(anguloACReal - 0.05)},${cy + (rInt-8) * Math.sin(anguloACReal - 0.05)}" fill="#c99e7f" />`;

            const astros = [
                { id: 'Sol', deg: datos.Sol.deg, sim: glifos.Sol, r: rInt - 12 },
                { id: 'Luna', deg: datos.Luna.deg, sim: glifos.Luna, r: rInt - 24 },
                { id: 'Mercurio', deg: datos.Mercurio.deg, sim: glifos.Mercurio, r: rInt - 36 },
                { id: 'Venus', deg: datos.Venus.deg, sim: glifos.Venus, r: rInt - 48 },
                { id: 'Marte', deg: datos.Marte.deg, sim: glifos.Marte, r: rInt - 60 },
                { id: 'Jupiter', deg: datos.Jupiter.deg, sim: glifos.Jupiter, r: rInt - 72 },
                { id: 'Saturno', deg: datos.Saturno.deg, sim: glifos.Saturno, r: rInt - 72 },
                { id: 'Urano', deg: datos.Urano.deg, sim: glifos.Urano, r: rInt - 84 },
                { id: 'Neptuno', deg: datos.Neptuno.deg, sim: glifos.Neptuno, r: rInt - 84 },
                { id: 'Pluto', deg: datos.Pluto.deg, sim: glifos.Pluto, r: rInt - 60 }
            ];

            for (let i = 0; i < astros.length; i++) {
                for (let j = i + 1; j < astros.length; j++) {
                    let diff = Math.abs(astros[i].deg - astros[j].deg);
                    if (diff > 180) diff = 360 - diff;
                    let orbita = 6;
                    let colorAspecto = null;

                    if (Math.abs(diff - 120) <= orbita || Math.abs(diff - 60) <= orbita) { colorAspecto = "#4a90e2"; } 
                    else if (Math.abs(diff - 180) <= orbita || Math.abs(diff - 90) <= orbita) { colorAspecto = "#d0021b"; }

                    if (colorAspecto) {
                        let rLine = rCent + 3;
                        let aRadI = transformarAnguloFijo(astros[i].deg);
                        let aRadJ = transformarAnguloFijo(astros[j].deg);
                        svg.innerHTML += `<line x1="${cx + rLine * Math.cos(aRadI)}" y1="${cy + rLine * Math.sin(aRadI)}" x2="${cx + rLine * Math.cos(aRadJ)}" y2="${cy + rLine * Math.sin(aRadJ)}" stroke="${colorAspecto}" stroke-width="1" stroke-opacity="0.45" />`;
                    }
                }
            }

            astros.forEach(astro => {
                let aRad = transformarAnguloFijo(astro.deg);
                let xp = cx + astro.r * Math.cos(aRad), yp = cy + astro.r * Math.sin(aRad);
                if (astro.id === 'Sol') {
                    svg.innerHTML += `<circle cx="${xp}" cy="${yp}" r="5.5" fill="#fcecd2" stroke="#d49a83" stroke-width="1.2" /><circle cx="${xp}" cy="${yp}" r="1" fill="#d49a83" />`;
                } else {
                    svg.innerHTML += `<text x="${xp}" y="${yp}" font-family='sans-serif' font-size='12' fill='#5a4538' text-anchor='middle' dominant-baseline='central'>${astro.sim}</text>`;
                }
            });
        }

        function obtenerFechaActualFormateada() {
            return new Date().toLocaleDateString('es-ES', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
        }

        async function solicitarInterpretacionYPlacidusIA(datosIniciales, fechaStr, horaStr, ciudad, intencionText, fechaHoy, apiKeyDinamica) {
            const url = `https://generativelanguage.googleapis.com/v1beta/models/${MODEL_NAME}:generateContent?key=${apiKeyDinamica}`;
            
            const prompt = `
                Tu identidad: Eres un consultor astrológico serio, profesional y elegante. Al mismo tiempo eres cálido y cercano. Te diriges al usuario estrictamente de "tú" (tuteo). No eres informal, pero tampoco distante. Te expresas con profundidad sin ser complicado o rebuscado.
                Tu lenguaje: Poético pero preciso. Prefieres las frases cortas y contundentes sobre los párrafos largos. Cuidad mucho cada palabra. Evitas por completo el lenguaje de ventas, la urgencia forzada y las frases hechas del mundo espiritual popular.
                Tus valores: Integridad, coherencia y autenticidad. Tratas a tu audiencia como adultos conscientes en una búsqueda espiritual seria que quieren desarrollarse con rigor, estructura y amor. Nunca suenas desesperado por convencer, evitas las metáforas excesivas y jamás eres superficial. No cites autores ni nombres académicos.
                Contexto de intención: El usuario ha declarado conscientemente que entra a este espacio con la siguiente intención real: "${intencionText}". Enmarca tus consejos sutilmente hacia esa necesidad de su conciencia.

                Datos astronómicos de nacimiento: Ciudad de ${ciudad} el día ${fechaStr} a las ${horaStr}. Fecha del día de hoy: ${fechaHoy}.

                REQUISITO MANDATORIO DE DATOS:
                Debes iniciar obligatoriamente tu respuesta con la siguiente cadena técnica exacta en la primera línea del texto, calculando con el máximo rigor científico el sistema de casas PLÁCIDUS para las 12 cúspides y las longitudes elípticas absolutas (de 0 a 360 grados) de los 10 planetas:
                SISTEMA_PLACIDUS_REAL(Asc:VALOR,Sol:VALOR,Luna:VALOR,Mer:VALOR,Ven:VALOR,Mar:VALOR,Jup:VALOR,Sat:VALOR,Ura:VALOR,Nep:VALOR,Plu:VALOR,C1:VALOR,C2:VALOR,C3:VALOR,C4:VALOR,C5:VALOR,C6:VALOR,C7:VALOR,C8:VALOR,C9:VALOR,C10:VALOR,C11:VALOR,C12:VALOR)
                (Nota de correspondencia: C1 es el valor de Asc, C10 es el Medio Cielo exacto de Plácidus). El texto no debe contener asteriscos ni markdown alrededor de esta etiqueta.

                Luego, genera los bloques narrativos en base a las siguientes etiquetas exactas:

                [NATAL]
                Escribe una interpretación profunda, contundente y breve de su esencia natal de nacimiento basándote en su mapa elíptico. Háblale directamente de tú.

                [VIDA]
                Escribe el consejo de centramiento y presencia para su vida personal el día de hoy (${fechaHoy}), respondiendo a tu intención declarada.

                [LABORAL]
                Escribe la guía con estructura para el pensamiento ordenado y la acción consciente en sus actividades profesionales de este día.
            `;

            try {
                const response = await fetch(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
                });

                const json = await response.json();
                const textoCompleto = json.candidates[0].content.parts[0].text;

                let datosCorregidos = { ...datosIniciales };
                
                const regex = /SISTEMA_PLACIDUS_REAL\(([^)]+)\)/;
                const match = textoCompleto.match(regex);
                
                if (match && match[1]) {
                    const parejas = match[1].split(',');
                    let cuspidesExtraidas = new Array(12);
                    
                    parejas.forEach(p => {
                        const [key, val] = p.split(':');
                        let numero = parseFloat(val);
                        if (!isNaN(numero)) {
                            let k = key.trim();
                            if (k === 'Asc') datosCorregidos.Ascendente.deg = numero;
                            if (k === 'Sol') datosCorregidos.Sol.deg = numero;
                            if (k === 'Luna') datosCorregidos.Luna.deg = numero;
                            if (k === 'Mer') datosCorregidos.Mercurio.deg = numero;
                            if (k === 'Ven') datosCorregidos.Venus.deg = numero;
                            if (k === 'Mar') datosCorregidos.Marte.deg = numero;
                            if (k === 'Jup') datosCorregidos.Jupiter.deg = numero;
                            if (k === 'Sat') datosCorregidos.Saturno.deg = numero;
                            if (k === 'Ura') datosCorregidos.Urano.deg = numero;
                            if (k === 'Nep') datosCorregidos.Neptuno.deg = numero;
                            if (k === 'Plu') datosCorregidos.Pluto.deg = numero;
                            
                            for(let c=1; c<=12; c++){
                                if(k === `C${c}`) { cuspidesExtraidas[c-1] = numero; }
                            }
                        }
                    });
                    
                    datosCorregidos.Ascendente.nombre = obtenerSignoDeGrado(datosCorregidos.Ascendente.deg);
                    if(!cuspidesExtraidas.includes(undefined)) {
                        datosCorregidos.Cuspides = cuspidesExtraidas;
                    }
                }

                const natalPart = textoCompleto.split('[NATAL]')[1]?.split('[VIDA]')[0]?.trim();
                const vidaPart = textoCompleto.split('[VIDA]')[1]?.split('[LABORAL]')[0]?.trim();
                const laboralPart = textoCompleto.split('[LABORAL]')[1]?.trim();

                return {
                    datosAstronomicos: datosCorregidos,
                    natal: natalPart || "El mapa traza la estructura de tu identidad.",
                    vida: vidaPart || "Presencia y centro en el espacio cotidiano hoy.",
                    laboral: laboralPart || "Orden en el pensar, claridad en la acción profesional."
                };
            } catch (error) {
                console.error("Error en sincronización Plácidus:", error);
                return {
                    datosAstronomicos: datosIniciales,
                    natal: "Tu mapa estelar se está consolidando con el cielo real. Un momento.",
                    vida: "Mantén la atención plena en el presente.",
                    laboral: "Estructura tus tareas con orden y paso firme."
                };
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            const form = document.getElementById('horoscopo-form');
            if (!form) return;

            form.addEventListener('submit', async function(e) {
                e.preventDefault();
                
                const fecha = document.getElementById('fecha').value;
                const hora = document.getElementById('hora').value;
                const lugarSelect = document.getElementById('lugar-select').value;
                const apiKeyIngresada = document.getElementById('api-key-input').value.trim();
                const intencionText = document.getElementById('intencion-select').value;
                const boton = document.getElementById('btn-enviar');
                
                if(!apiKeyIngresada) { alert("Por favor introduce tu Clave de Acceso."); return; }

                localStorage.setItem('user_cosmos_key', apiKeyIngresada);
                boton.disabled = true;
                boton.innerText = "Calculando Cúspides Reales...";

                const [latStr, lonStr, tzStr, nombreCiudad] = lugarSelect.split(',');
                let datosCosmicos = generarDatosEstructuraBase(fecha);

                const fechaHoyText = obtenerFechaActualFormateada();
                document.getElementById('fecha-actual-badge').innerText = fechaHoyText;

                document.getElementById('lbl-solar').innerText = "Sol: " + obtenerSignoDeGrado(datosCosmicos.Sol.deg);
                document.getElementById('lbl-lunar').innerText = "Luna: " + obtenerSignoDeGrado(datosCosmicos.Luna.deg);
                document.getElementById('lbl-ascendente').innerText = "Asc: " + datosCosmicos.Ascendente.nombre;
                dibujarMandalaAstrodienst(datosCosmicos);

                document.getElementById('pantalla-bienvenida').style.display = 'none';
                document.getElementById('pantalla-dashboard').style.display = 'flex';

                const respuestaIA = await solicitarInterpretacionYPlacidusIA(datosCosmicos, fecha, hora, nombreCiudad, intencionText, fechaHoyText, apiKeyIngresada);

                datosCosmicos = respuestaIA.datosAstronomicos;
                document.getElementById('lbl-solar').innerText = "Sol: " + obtenerSignoDeGrado(datosCosmicos.Sol.deg);
                document.getElementById('lbl-lunar').innerText = "Luna: " + obtenerSignoDeGrado(datosCosmicos.Luna.deg);
                document.getElementById('lbl-ascendente').innerText = "Asc: " + datosCosmicos.Ascendente.nombre;
                
                dibujarMandalaAstrodienst(datosCosmicos);

                document.getElementById('texto-natal-fijo').innerHTML = respuestaIA.natal;
                document.getElementById('consejo-vida').innerHTML = respuestaIA.vida;
                document.getElementById('consejo-laboral').innerHTML = respuestaIA.laboral;
            });
