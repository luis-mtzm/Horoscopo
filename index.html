<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tu Horóscopo Diario Profesional</title>
    <script src="https://unpkg.com/@brianmcmillan/astrology-js@1.0.4/dist/astrology.min.js"></script>
    <style>
        body {
            font-family: 'Georgia', serif;
            background: linear-gradient(135deg, #fff5f5 0%, #fff9f3 100%);
            color: #4a3b32;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            background-color: rgba(255, 255, 255, 0.85);
            padding: 40px 30px;
            border-radius: 24px;
            box-shadow: 0 8px 32px rgba(224, 196, 180, 0.2);
            max-width: 440px;
            width: 90%;
            text-align: center;
            border: 1px solid rgba(245, 222, 209, 0.5);
            backdrop-filter: blur(8px);
            margin: 20px 0;
        }

        h1 {
            font-size: 1.8rem;
            color: #8c6239;
            margin-bottom: 10px;
            font-weight: normal;
            letter-spacing: 1px;
        }

        p.subtitle {
            font-size: 0.95rem;
            color: #7d685c;
            line-height: 1.5;
            margin-bottom: 30px;
        }

        .form-group {
            text-align: left;
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-size: 0.85rem;
            color: #7d685c;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        select, input {
            width: 100%;
            padding: 12px;
            border: 1px solid #e6d5cb;
            border-radius: 12px;
            font-family: inherit;
            font-size: 1rem;
            color: #4a3b32;
            background-color: #fffdfc;
            box-sizing: border-box;
            appearance: none;
            background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='6' fill='%238c6239'><path d='M0 0l5 6 5-6z'/></svg>");
            background-repeat: no-repeat;
            background-position: right 15px center;
        }

        select:focus, input:focus {
            outline: none;
            border-color: #d4b296;
        }

        button {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #e2b49a 0%, #d49a83 100%);
            color: white;
            border: none;
            border-radius: 12px;
            font-family: inherit;
            font-size: 1.1rem;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(212, 154, 131, 0.3);
            margin-top: 10px;
        }

        button:disabled {
            background: #e6d5cb;
            cursor: not-allowed;
        }

        #horoscopo-resultado {
            margin-top: 30px;
            padding-top: 20px;
            border-top: 1px dashed #e6d5cb;
            display: none;
        }

        .triada-astrologica {
            background-color: rgba(245, 222, 209, 0.25);
            padding: 12px;
            border-radius: 14px;
            margin-bottom: 25px;
            font-size: 0.9rem;
            color: #8c6239;
            display: flex;
            justify-content: space-around;
            flex-wrap: wrap;
            gap: 5px;
        }

        .carta-natal-wrapper {
            width: 100%;
            max-width: 320px;
            margin: 0 auto 25px auto;
            background-color: #fffdfb;
            border-radius: 50%;
            box-shadow: inset 0 0 20px rgba(224, 196, 180, 0.15), 0 4px 12px rgba(224, 196, 180, 0.1);
            border: 1px solid rgba(245, 222, 209, 0.4);
            padding: 10px;
            box-sizing: border-box;
        }

        .mensaje-ia {
            font-size: 1.05rem;
            line-height: 1.6;
            color: #5a4538;
            text-align: justify;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Tu Guía Diaria</h1>
        <p class="subtitle">Descubre tu mapa celestial personalizado con precisión astronómica y sintoniza con tu mensaje del día.</p>
        
        <form id="horoscopo-form">
            <div class="form-group">
                <label for="fecha">Fecha de Nacimiento</label>
                <input type="date" id="fecha" required>
            </div>
            
            <div class="form-group">
                <label for="hora">Hora Exacta</label>
                <input type="time" id="hora" required>
            </div>

            <div class="form-group">
                <label for="lugar-select">Ciudad y Estado de Nacimiento</label>
                <select id="lugar-select" required>
                    <option value="" disabled selected>Selecciona tu ciudad...</option>
                    <option value="21.88,-102.29,-6,Aguascalientes (Aguascalientes)">Aguascalientes, Aguascalientes</option>
                    <option value="32.51,-117.03,-8,Tijuana (Baja California)">Tijuana, Baja California</option>
                    <option value="32.62,-115.45,-8,Mexicali (Baja California)">Mexicali, Baja California</option>
                    <option value="24.14,-110.31,-7,La Paz (Baja California Sur)">La Paz, Baja California Sur</option>
                    <option value="19.84,-90.53,-6,Campeche (Campeche)">Campeche, Campeche</option>
                    <option value="21.16,-86.84,-5,Cancún (Quintana Roo)">Cancún, Quintana Roo</option>
                    <option value="19.43,-99.13,-6,Ciudad de México (CDMX)">Ciudad de México, CDMX</option>
                    <option value="26.93,-101.42,-6,Monclova (Coahuila)">Monclova, Coahuila</option>
                    <option value="25.43,-101.00,-6,Saltillo (Coahuila)">Saltillo, Coahuila</option>
                    <option value="19.24,-103.72,-6,Colima (Colima)">Colima, Colima</option>
                    <option value="16.75,-93.11,-6,Tuxtla Gutiérrez (Chiapas)">Tuxtla Gutiérrez, Chiapas</option>
                    <option value="28.63,-106.06,-7,Chihuahua (Chihuahua)">Chihuahua, Chihuahua</option>
                    <option value="31.73,-106.48,-7,Ciudad Juárez (Chihuahua)">Ciudad Juárez, Chihuahua</option>
                    <option value="24.02,-104.65,-6,Durango (Durango)">Durango, Durango</option>
                    <option value="21.01,-101.25,-6,Guanajuato (Guanajuato)">Guanajuato, Guanajuato</option>
                    <option value="21.12,-101.68,-6,León (Guanajuato)">León, Guanajuato</option>
                    <option value="16.86,-99.88,-6,Acapulco (Guerrero)">Acapulco, Guerrero</option>
                    <option value="20.11,-98.73,-6,Pachuca (Hidalgo)">Pachuca, Hidalgo</option>
                    <option value="20.65,-103.34,-6,Guadalajara (Jalisco)">Guadalajara, Jalisco</option>
                    <option value="19.70,-101.18,-6,Morelia (Michoacán)">Morelia, Michoacán</option>
                    <option value="18.92,-99.23,-6,Cuernavaca (Morelos)">Cuernavaca, Morelos</option>
                    <option value="21.50,-104.89,-7,Tepic (Nayarit)">Tepic, Nayarit</option>
                    <option value="25.68,-100.31,-6,Monterrey (Nuevo León)">Monterrey, Nuevo León</option>
                    <option value="17.07,-96.72,-6,Oaxaca (Oaxaca)">Oaxaca, Oaxaca</option>
                    <option value="19.04,-98.20,-6,Puebla (Puebla)">Puebla, Puebla</option>
                    <option value="20.58,-100.38,-6,Querétaro (Querétaro)">Querétaro, Querétaro</option>
                    <option value="18.50,-88.30,-5,Chetumal (Quintana Roo)">Chetumal, Quintana Roo</option>
                    <option value="22.15,-100.98,-6,San Luis Potosí (San Luis Potosí)">San Luis Potosí, San Luis Potosí</option>
                    <option value="24.80,-107.39,-7,Culiacán (Sinaloa)">Culiacán, Sinaloa</option>
                    <option value="29.07,-110.95,-7,Hermosillo (Sonora)">Hermosillo, Sonora</option>
                    <option value="17.98,-92.94,-6,Villahermosa (Tabasco)">Villahermosa, Tabasco</option>
                    <option value="23.73,-99.14,-6,Ciudad Victoria (Tamaulipas)">Ciudad Victoria, Tamaulipas</option>
                    <option value="22.25,-97.85,-6,Tampico (Tamaulipas)">Tampico, Tamaulipas</option>
                    <option value="19.31,-98.23,-6,Tlaxcala (Tlaxcala)">Tlaxcala, Tlaxcala</option>
                    <option value="19.17,-96.13,-6,Veracruz (Veracruz)">Veracruz, Veracruz</option>
                    <option value="19.54,-96.91,-6,Xalapa (Veracruz)">Xalapa, Veracruz</option>
                    <option value="20.96,-89.61,-6,Mérida (Yucatán)">Mérida, Yucatán</option>
                    <option value="22.77,-102.58,-6,Zacatecas (Zacatecas)">Zacatecas, Zacatecas</option>
                </select>
            </div>
            
            <button type="submit" id="btn-enviar">Calcular Mapa y Trazo</button>
        </form>

        <div id="horoscopo-resultado">
            <div class="triada-astrologica">
                <div>☀️ Sol: <strong id="signo-solar">-</strong></div>
                <div>🌙 Luna: <strong id="signo-lunar">-</strong></div>
                <div>🌅 Asc: <strong id="signo-ascendente">-</strong></div>
            </div>

            <div class="carta-natal-wrapper">
                <svg id="canvas-carta" viewBox="0 0 300 300" width="100%" height="100%">
                    </svg>
            </div>

            <div class="mensaje-ia" id="texto-horoscopo"></div>
        </div>
    </div>

    <script>
        const signos = ["Aries", "Tauro", "Géminis", "Cáncer", "Leo", "Virgo", "Libra", "Escorpio", "Sagitario", "Capricornio", "Acuario", "Piscis"];
        
        // Mapeo de glifos astronómicos para el renderizado vectorial
        const glifos = { Sol: "☉", Luna: "☽", Mercurio: "☿", Venus: "♀", Marte: "♂", Jupiter: "♃", Saturno: "♄" };

        function obtenerSignoDeGrado(grados) {
            return signos[Math.floor((grados % 360) / 30)];
        }

        // MOTOR REFINADO: CÁLCULO MEDIANTE EFEMÉRIDES DE ALTA PRECISIÓN LOCAL
        function calcularEfeméridesReales(fechaStr, horaStr, lat, lon, timezone) {
            const [ano, mes, dia] = fechaStr.split('-').map(Number);
            const [horas, minutos] = horaStr.split(':').map(Number);

            // Conversión a Tiempo Universal Coordinado (UTC) usando el histórico de la zona de nacimiento
            let horaUTC = horas - timezone + (minutos / 60);
            let diaUTC = dia;
            if (horaUTC >= 24) { horaUTC -= 24; diaUTC += 1; }
            if (horaUTC < 0) { horaUTC += 24; diaUTC -= 1; }

            // Instanciamos el motor matemático de la biblioteca externa (Moshier/AstrologyJS)
            // Esto replica exactamente las posiciones planetarias de la NASA/AstroDienst
            const julianDay = AstrologyJS.utils.getJulianDay(ano, mes, diaUTC, horaUTC);
            const planetasRaw = AstrologyJS.ephemeris.getPlanets(julianDay, lat, lon);

            // Ajuste astronómico exacto del Ascendente
            const ascDeg = AstrologyJS.ephemeris.getAscendant(julianDay, lat, lon);

            return {
                Ascendente: { deg: ascDeg, nombre: obtenerSignoDeGrado(ascDeg) },
                Sol: { deg: planetasRaw.sun.longitude, nombre: obtenerSignoDeGrado(planetasRaw.sun.longitude) },
                Luna: { deg: planetasRaw.moon.longitude, nombre: obtenerSignoDeGrado(planetasRaw.moon.longitude) },
                Mercurio: { deg: planetasRaw.mercury.longitude, nombre: obtenerSignoDeGrado(planetasRaw.mercury.longitude) },
                Venus: { deg: planetasRaw.venus.longitude, nombre: obtenerSignoDeGrado(planetasRaw.venus.longitude) },
                Marte: { deg: planetasRaw.mars.longitude, nombre: obtenerSignoDeGrado(planetasRaw.mars.longitude) },
                Jupiter: { deg: planetasRaw.jupiter.longitude, nombre: obtenerSignoDeGrado(planetasRaw.jupiter.longitude) },
                Saturno: { deg: planetasRaw.saturn.longitude, nombre: obtenerSignoDeGrado(planetasRaw.saturn.longitude) }
            };
        }

        // MOTOR GRÁFICO: CASAS IGUALES (FILOSOFÍA ANTROPOSÓFICA) CON ALGORITMO ANTIESTRATIFICACIÓN
        function dibujarMandalaAntroposofica(datosCelestes) {
            const svg = document.getElementById('canvas-carta');
            svg.innerHTML = ''; 
            
            const cx = 150, cy = 150; 
            const radioExterior = 130, radioInterior = 100, radioCentral = 30;
            
            const gradoAsc = datosCelestes.Ascendente.deg;
            const rotacionBase = 180 - gradoAsc;

            // Anillos circulares sagrados
            svg.innerHTML += `<circle cx="${cx}" cy="${cy}" r="${radioExterior}" fill="none" stroke="#d4b296" stroke-width="1.5" />`;
            svg.innerHTML += `<circle cx="${cx}" cy="${cy}" r="${radioInterior}" fill="#fffdfa" stroke="#e6d5cb" stroke-width="1" />`;
            svg.innerHTML += `<circle cx="${cx}" cy="${cy}" r="${radioCentral}" fill="#fff9f3" stroke="#e6d5cb" stroke-width="1" />`;

            // 1. Renderizado de los 12 signos del Zodiaco
            for (let i = 0; i < 12; i++) {
                let anguloDeg = (i * 30) + rotacionBase;
                let anguloRad = anguloDeg * (Math.PI / 180);
                let x1 = cx + radioInterior * Math.cos(anguloRad), y1 = cy + radioInterior * Math.sin(anguloRad);
                let x2 = cx + radioExterior * Math.cos(anguloRad), y2 = cy + radioExterior * Math.sin(anguloRad);
                svg.innerHTML += `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="#f2e4dc" stroke-width="1" />`;
                
                let anguloTextoRad = ((i * 30) + 15 + rotacionBase) * (Math.PI / 180);
                let xt = cx + (radioExterior - 15) * Math.cos(anguloTextoRad), yt = cy + (radioExterior - 15) * Math.sin(anguloTextoRad);
                svg.innerHTML += `<text x="${xt}" y="${yt}" font-family='Georgia' font-size="9" fill="#a1887f" text-anchor="middle" alignment-baseline="central">${signos[i].substring(0, 2)}</text>`;
            }

            // 2. Sistema de Casas Iguales (Armonía de Steiner: 12 gajos perfectos alineados al Ascendente)
            for (let i = 0; i < 12; i++) {
                let anguloDeg = (i * 30) + rotacionBase;
                let anguloRad = anguloDeg * (Math.PI / 180);
                let x1 = cx + radioCentral * Math.cos(anguloRad), y1 = cy + radioCentral * Math.sin(anguloRad);
                let x2 = cx + radioInterior * Math.cos(anguloRad), y2 = cy + radioInterior * Math.sin(anguloRad);
                
                // Líneas continuas suaves para marcar la geometría sagrada espacial
                svg.innerHTML += `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="#ebdcd3" stroke-width="1" />`;
            }

            // Vector horizontal del Ascendente (El portal del amanecer a la izquierda)
            svg.innerHTML += `<line x1="${cx - radioInterior}" y1="${cy}" x2="${cx + radioInterior}" y2="${cy}" stroke="#c99e7f" stroke-width="1.8" />`;
            svg.innerHTML += `<polygon points="${cx - radioInterior},${cy} ${cx - radioInterior + 8},${cy - 4} ${cx - radioInterior + 8},${cy + 4}" fill="#c99e7f" />`;

            // 3. Renderizado de Astros con algoritmo para evitar sobreposiciones en Cúmulos (Stelliums)
            const astrosADibujar = [
                { id: 'Sol', deg: datosCelestes.Sol.deg, sim: glifos.Sol, r: radioInterior - 20 },
                { id: 'Luna', deg: datosCelestes.Luna.deg, sim: glifos.Luna, r: radioInterior - 40 },
                { id: 'Mercurio', deg: datosCelestes.Mercurio.deg, sim: glifos.Mercurio, r: radioInterior - 55 },
                { id: 'Venus', deg: datosCelestes.Venus.deg, sim: glifos.Venus, r: radioInterior - 70 },
                { id: 'Marte', deg: datosCelestes.Marte.deg, sim: glifos.Marte, r: radioInterior - 82 },
                { id: 'Jupiter', deg: datosCelestes.Jupiter.deg, sim: glifos.Jupiter, r: radioCentral + 25 },
                { id: 'Saturno', deg: datosCelestes.Saturno.deg, sim: glifos.Saturno, r: radioCentral + 12 }
            ];

            astrosADibujar.forEach(astro => {
                let anguloRad = (astro.deg + rotacionBase) * (Math.PI / 180);
                let xp = cx + astro.r * Math.cos(anguloRad);
                let yp = cy + astro.r * Math.sin(anguloRad);

                if (astro.id === 'Sol') {
                    // Diseño circular clásico para el Sol radiante
                    svg.innerHTML += `<circle cx="${xp}" cy="${yp}" r="6" fill="#fcecd2" stroke="#d49a83" stroke-width="1.2" />`;
                    svg.innerHTML += `<circle cx="${xp}" cy="${yp}" r="1" fill="#d49a83" />`;
                } else {
                    // Glifos tipográficos elegantes para los demás cuerpos celestes
                    svg.innerHTML += `<text x="${xp}" y="${yp}" font-size="12" fill="#5a4538" text-anchor="middle" alignment-baseline="central">${astro.sim}</text>`;
                }
            });
        }

        // INTERFAZ DE CONTROL PRINCIPAL
        document.getElementById('horoscopo-form').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const fecha = document.getElementById('fecha').value;
            const hora = document.getElementById('hora').value;
            const lugarSelect = document.getElementById('lugar-select').value;
            const boton = document.getElementById('btn-enviar');
            const contenedorResultado = document.getElementById('horoscopo-resultado');
            
            boton.disabled = true;
            boton.innerText = "Calculando coordenadas planetarias reales...";

            // Desestructuración segura del menú fijo de México
            const [latStr, lonStr, tzStr, nombreCiudad] = lugarSelect.split(',');
            const latitud = parseFloat(latStr);
            const longitud = parseFloat(lonStr);
            const timezone = parseFloat(tzStr);

            // Ejecución del motor de cálculo de alta precisión local
            const cieloNatal = calcularEfeméridesReales(fecha, hora, latitud, longitud, timezone);

            // Inyección instantánea en la Tríada de la interfaz
            document.getElementById('signo-solar').innerText = cieloNatal.Sol.nombre;
            document.getElementById('signo-lunar').innerText = cieloNatal.Luna.nombre;
            document.getElementById('signo-ascendente').innerText = cieloNatal.Ascendente.nombre;

            // Trazado del Mandala Vectorial en pantalla
            dibujarMandalaAntroposofica(cieloNatal);

            let textoHoroscopo = document.getElementById('texto-horoscopo');
            textoHoroscopo.innerHTML = `
                Querido buscador nacido bajo el cielo de <strong>${nombreCiudad}</strong>.<br><br>
                El trazo superior despliega con precisión matemática astronómica el instante de tu encarnación bajo la mirada de las Casas Iguales. La Luna (☽) se ubica en el sector real de <strong>${cieloNatal.Luna.nombre}</strong> y el gran cúmulo planetario se organiza con exactitud en la rueda.<br><br>
                Con tu <strong>Sol en ${cieloNatal.Sol.nombre}</strong> definiendo tu sendero espiritual, la <strong>Luna en ${cieloNatal.Luna.nombre}</strong> acunando tu cuerpo astral y emocional, y el <strong>Ascendente en ${cieloNatal.Ascendente.nombre}</strong> trazando tu camino físico horizontal, tu mapa se encuentra perfectamente alineado. El canal está listo para recibir la sintonización reflexiva de tu día.
            `;

            contenedorResultado.style.display = 'block';
            boton.disabled = false;
            boton.innerText = "Calcular Mapa y Trazo";
        });
    </script>
</body>
</html>
