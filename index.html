<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tu Horóscopo Diario Profesional</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/astronomy-engine/2.1.19/astronomy.browser.min.js"></script>
    <style>
        body {
            font-family: 'Georgia', serif;
            background: linear-gradient(135deg, #fff5f5 0%, #fff9f3 100%);
            color: #4a3b32;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            background-color: rgba(255, 255, 255, 0.85);
            padding: 40px 30px;
            border-radius: 24px;
            box-shadow: 0 8px 32px rgba(224, 196, 180, 0.2);
            max-width: 440px;
            width: 90%;
            text-align: center;
            border: 1px solid rgba(245, 222, 209, 0.5);
            backdrop-filter: blur(8px);
            margin: 20px 0;
        }

        h1 {
            font-size: 1.8rem;
            color: #8c6239;
            margin-bottom: 10px;
            font-weight: normal;
            letter-spacing: 1px;
        }

        p.subtitle {
            font-size: 0.95rem;
            color: #7d685c;
            line-height: 1.5;
            margin-bottom: 30px;
        }

        .form-group {
            text-align: left;
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-size: 0.85rem;
            color: #7d685c;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        select, input {
            width: 100%;
            padding: 12px;
            border: 1px solid #e6d5cb;
            border-radius: 12px;
            font-family: inherit;
            font-size: 1rem;
            color: #4a3b32;
            background-color: #fffdfc;
            box-sizing: border-box;
            appearance: none;
            background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='6' fill='%238c6239'><path d='M0 0l5 6 5-6z'/></svg>");
            background-repeat: no-repeat;
            background-position: right 15px center;
        }

        button {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #e2b49a 0%, #d49a83 100%);
            color: white;
            border: none;
            border-radius: 12px;
            font-family: inherit;
            font-size: 1.1rem;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(212, 154, 131, 0.3);
            margin-top: 10px;
        }

        button:disabled {
            background: #e6d5cb;
            cursor: not-allowed;
        }

        #horoscopo-resultado {
            margin-top: 30px;
            padding-top: 20px;
            border-top: 1px dashed #e6d5cb;
            display: none;
        }

        .triada-astrologica {
            background-color: rgba(245, 222, 209, 0.25);
            padding: 12px;
            border-radius: 14px;
            margin-bottom: 25px;
            font-size: 0.9rem;
            color: #8c6239;
            display: flex;
            justify-content: space-around;
        }

        .carta-natal-wrapper {
            width: 100%;
            max-width: 320px;
            margin: 0 auto 25px auto;
            background-color: #fffdfb;
            border-radius: 50%;
            box-shadow: inset 0 0 20px rgba(224, 196, 180, 0.15), 0 4px 12px rgba(224, 196, 180, 0.1);
            border: 1px solid rgba(245, 222, 209, 0.4);
            padding: 10px;
            box-sizing: border-box;
        }

        .mensaje-ia {
            font-size: 1.05rem;
            line-height: 1.6;
            color: #5a4538;
            text-align: justify;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Tu Guía Diaria</h1>
        <p class="subtitle">Descubre tu mapa celestial con precisión de efemérides verdaderas y sintoniza con tu mensaje del alma.</p>
        
        <form id="horoscopo-form">
            <div class="form-group">
                <label for="fecha">Fecha de Nacimiento</label>
                <input type="date" id="fecha" required>
            </div>
            
            <div class="form-group">
                <label for="hora">Hora Exacta</label>
                <input type="time" id="hora" required>
            </div>

            <div class="form-group">
                <label for="lugar-select">Ciudad y Estado de Nacimiento</label>
                <select id="lugar-select" required>
                    <option value="" disabled selected>Selecciona tu ciudad...</option>
                    <option value="24.02,-104.65,-6,Durango (Durango)">Durango, Durango</option>
                    <option value="19.43,-99.13,-6,Ciudad de México (CDMX)">Ciudad de México, CDMX</option>
                    <option value="25.68,-100.31,-6,Monterrey (Nuevo León)">Monterrey, Nuevo León</option>
                    <option value="20.65,-103.34,-6,Guadalajara (Jalisco)">Guadalajara, Jalisco</option>
                    <option value="21.16,-86.84,-5,Cancún (Quintana Roo)">Cancún, Quintana Roo</option>
                    <option value="20.96,-89.61,-6,Mérida (Yucatán)">Mérida, Yucatán</option>
                </select>
            </div>
            
            <button type="submit" id="btn-enviar">Calcular Mapa y Trazo</button>
        </form>

        <div id="horoscopo-resultado">
            <div class="triada-astrologica">
                <div>☀️ Sol: <strong id="signo-solar">-</strong></div>
                <div>🌙 Luna: <strong id="signo-lunar">-</strong></div>
                <div>🌅 Asc: <strong id="signo-ascendente">-</strong></div>
            </div>

            <div class="carta-natal-wrapper">
                <svg id="canvas-carta" viewBox="0 0 300 300" width="100%" height="100%">
                    </svg>
            </div>

            <div class="mensaje-ia" id="texto-horoscopo"></div>
        </div>
    </div>

    <script>
        const signos = ["Aries", "Tauro", "Géminis", "Cáncer", "Leo", "Virgo", "Libra", "Escorpio", "Sagitario", "Capricornio", "Acuario", "Piscis"];
        const glifos = { Sol: "☉", Luna: "☽", Mercurio: "☿", Venus: "♀", Marte: "♂" };

        function obtenerSignoDeGrado(longitudEcliptica) {
            return signos[Math.floor((longitudEcliptica % 360) / 30)];
        }

        // MOTOR DE EFEMÉRIDES CIENTÍFICAS UNIVERSAL (ASTRONOMY ENGINE)
        function calcularMapaAstronomicoUniversal(fechaStr, horaStr, lat, lon, timezone) {
            const [ano, mes, dia] = fechaStr.split('-').map(Number);
            const [horas, minutos] = horaStr.split(':').map(Number);

            // 1. Crear fecha con la hora local ajustando la zona horaria para obtener el tiempo UTC real
            const fechaLocal = new Date(ano, mes - 1, dia, horas, minutos);
            const fechaUTC = new Date(fechaLocal.getTime() - (timezone * 60 * 60 * 1000));
            const astroTime = Astronomy.MakeTime(fechaUTC);

            // 2. Obtener posiciones eclípticas geo-céntricas verdaderas de los astros (NASA VSOP87/DE405)
            const posSol = Astronomy.EclipticLongitude(Astronomy.Body.Sun, astroTime);
            const posLuna = Astronomy.EclipticLongitude(Astronomy.Body.Moon, astroTime);
            const posMercurio = Astronomy.EclipticLongitude(Astronomy.Body.Mercury, astroTime);
            const posVenus = Astronomy.EclipticLongitude(Astronomy.Body.Venus, astroTime);
            const posMarte = Astronomy.EclipticLongitude(Astronomy.Body.Mars, astroTime);

            // 3. Cálculo matemático exacto del Ascendente basado en el Tiempo Sidéreo Local Real
            const siderealTime = Astronomy.SiderealTime(astroTime); // GMST en horas
            const lst = (siderealTime + lon / 15) % 24; // Tiempo sidéreo local en horas
            const ramc = lst * 15; // Recta ascensión en grados
            const obliq = 23.4393 * (Math.PI / 180);
            const latRad = lat * (Math.PI / 180);
            const ramcRad = ramc * (Math.PI / 180);
            
            let ascRad = Math.atan2(-Math.cos(ramcRad), (Math.sin(obliq) * Math.tan(latRad) + Math.cos(obliq) * Math.sin(ramcRad)));
            let ascDeg = ascRad * (180 / Math.PI);
            if (ascDeg < 0) ascDeg += 360;

            return {
                Ascendente: { deg: ascDeg, nombre: obtenerSignoDeGrado(ascDeg) },
                Sol: { deg: posSol, nombre: obtenerSignoDeGrado(posSol) },
                Luna: { deg: posLuna, nombre: obtenerSignoDeGrado(posLuna) },
                Mercurio: { deg: posMercurio, nombre: obtenerSignoDeGrado(posMercurio) },
                Venus: { deg: posVenus, nombre: obtenerSignoDeGrado(posVenus) },
                Marte: { deg: posMarte, nombre: obtenerSignoDeGrado(posMarte) }
            };
        }

        // MOTOR GRÁFICO WALDORF: CASAS IGUALES ANTROPOSÓFICAS
        function dibujarMandalaUniversal(datos) {
            const svg = document.getElementById('canvas-carta');
            svg.innerHTML = '';
            const cx = 150, cy = 150, rExt = 130, rInt = 100, rCent = 30;
            const rotBase = 180 - datos.Ascendente.deg;

            // Círculos concéntricos de diseño
            svg.innerHTML += `<circle cx="${cx}" cy="${cy}" r="${rExt}" fill="none" stroke="#d4b296" stroke-width="1.5" />`;
            svg.innerHTML += `<circle cx="${cx}" cy="${cy}" r="${rInt}" fill="#fffdfa" stroke="#e6d5cb" stroke-width="1" />`;
            svg.innerHTML += `<circle cx="${cx}" cy="${cy}" r="${rCent}" fill="#fff9f3" stroke="#e6d5cb" stroke-width="1" />`;

            // Rueda de los 12 signos (30° exactos cada uno)
            for (let i = 0; i < 12; i++) {
                let aRad = ((i * 30) + rotBase) * (Math.PI / 180);
                svg.innerHTML += `<line x1="${cx + rInt * Math.cos(aRad)}" y1="${cy + rInt * Math.sin(aRad)}" x2="${cx + rExt * Math.cos(aRad)}" y2="${cy + rExt * Math.sin(aRad)}" stroke="#f2e4dc" stroke-width="1" />`;
                let aTextRad = ((i * 30) + 15 + rotBase) * (Math.PI / 180);
                svg.innerHTML += `<text x="${cx + (rExt - 15) * Math.cos(aTextRad)}" y="${cy + (rExt - 15) * Math.sin(aTextRad)}" font-family='Georgia' font-size="9" fill="#a1887f" text-anchor="middle" alignment-baseline="central">${signos[i].substring(0,2)}</text>`;
            }

            // Sistema de Casas Iguales (División geométrica simétrica pura de Rudolf Steiner)
            for (let i = 0; i < 12; i++) {
                let aRad = ((i * 30) + rotBase) * (Math.PI / 180);
                svg.innerHTML += `<line x1="${cx + rCent * Math.cos(aRad)}" y1="${cy + rCent * Math.sin(aRad)}" x2="${cx + rInt * Math.cos(aRad)}" y2="${cy + rInt * Math.sin(aRad)}" stroke="#ebdcd3" stroke-width="1" />`;
            }

            // Vector del Horizonte / Ascendente (Línea izquierda dorada)
            svg.innerHTML += `<line x1="${cx - rInt}" y1="${cy}" x2="${cx + rInt}" y2="${cy}" stroke="#c99e7f" stroke-width="1.8" />`;
            svg.innerHTML += `<polygon points="${cx - rInt},${cy} ${cx - rInt + 8},${cy - 4} ${cx - rInt + 8},${cy + 4}" fill="#c99e7f" />`;

            // Colocación de los planetas en niveles concéntricos para evitar colisión en Stelliums
            const astros = [
                { id: 'Sol', deg: datos.Sol.deg, sim: glifos.Sol, r: rInt - 16 },
                { id: 'Luna', deg: datos.Luna.deg, sim: glifos.Luna, r: rInt - 34 },
                { id: 'Mercurio', deg: datos.Mercurio.deg, sim: glifos.Mercurio, r: rInt - 52 },
                { id: 'Venus', deg: datos.Venus.deg, sim: glifos.Venus, r: rInt - 68 },
                { id: 'Marte', deg: datos.Marte.deg, sim: glifos.Marte, r: rInt - 84 }
            ];

            astros.forEach(astro => {
                let aRad = (astro.deg + rotBase) * (Math.PI / 180);
                let xp = cx + astro.r * Math.cos(aRad), yp = cy + astro.r * Math.sin(aRad);
                if (astro.id === 'Sol') {
                    svg.innerHTML += `<circle cx="${xp}" cy="${yp}" r="6" fill="#fcecd2" stroke="#d49a83" stroke-width="1.2" /><circle cx="${xp}" cy="${yp}" r="1" fill="#d49a83" />`;
                } else {
                    svg.innerHTML += `<text x="${xp}" y="${yp}" font-size="13" fill="#5a4538" text-anchor="middle" alignment-baseline="central">${astro.sim}</text>`;
                }
            });
        }

        // CONTROLADOR GLOBAL INTERACTIVO
        document.getElementById('horoscopo-form').addEventListener('submit', function(e) {
            e.preventDefault();
            const fecha = document.getElementById('fecha').value;
            const hora = document.getElementById('hora').value;
            const lugarSelect = document.getElementById('lugar-select').value;
            const contenedorResultado = document.getElementById('horoscopo-resultado');
            
            const [latStr, lonStr, tzStr, nombreCiudad] = lugarSelect.split(',');
            
            // Llamada al motor de efemérides verdaderas (Costo $0, precisión universal de la NASA)
            const datosAstrologicos = calcularMapaAstronomicoUniversal(fecha, hora, parseFloat(latStr), parseFloat(lonStr), parseFloat(tzStr));

            document.getElementById('signo-solar').innerText = datosAstrologicos.Sol.nombre;
            document.getElementById('signo-lunar').innerText = datosAstrologicos.Luna.nombre;
            document.getElementById('signo-ascendente').innerText = datosAstrologicos.Ascendente.nombre;

            // Renderizar la mandala matemática real
            dibujarMandalaUniversal(datosAstrologicos);

            document.getElementById('texto-horoscopo').innerHTML = `
                Querido buscador nacido en <strong>${nombreCiudad}</strong>.<br><br>
                Este mandala se ha trazado de forma 100% matemática y local utilizando las efemérides planetarias universales. Tu <strong>Sol en ${datosAstrologicos.Sol.nombre}</strong>, tu <strong>Luna en ${datosAstrologicos.Luna.nombre}</strong> y tu <strong>Ascendente en ${datosAstrologicos.Ascendente.nombre}</strong> marcan tu mapa natal real.<br><br>
                Bajo la estructura armónica de Casas Iguales, tu geometría celeste está lista. Tu navegador ha resuelto la astronomía de manera exacta e independiente para cualquier fecha seleccionada.
            `;

            contenedorResultado.style.display = 'block';
        });
    </script>
</body>
</html>
